<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickQueue Dark</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <main id="app">
    <aside id="sidebar">
      <input
        type="text"
        id="videoInput"
        placeholder="Paste a YouTube URL and press Enter..."
        aria-label="YouTube URL"
      />

      <ul id="playlist"></ul>
    </aside>

    <section id="player-section">
      <!-- blank until a video is selected -->
      <div id="player-wrapper" class="hidden">
        <div id="player"></div>
        <button id="removeCurrent" class="hidden">✕ Remove Current Video</button>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
